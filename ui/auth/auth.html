<!-- Login Modal Overlay -->
<div id="login-modal" class="modal-overlay" style="display: none;">
  <div class="modal-card" style="width: 400px; padding: 28px;">
    <div style="text-align: center; margin-bottom: 24px;">
      <div style="width: 50px; height: 50px; background: var(--primary-light); border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px;">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="var(--primary)"><path d="M12 2L2 22h20L12 2zm0 4.5l6.5 13h-13L12 6.5z"/></svg>
      </div>
      <h3 style="margin: 0 0 6px 0; font-size: 1.3rem; color: var(--text-main);">Đăng Nhập SmartApp</h3>
      <p style="margin: 0; font-size: 0.85rem; color: var(--text-secondary);">Nhập thông tin quản trị viên để tiếp tục</p>
    </div>

    <form id="login-form" onsubmit="event.preventDefault(); handleLoginSubmit();">
      <div class="form-group" style="margin-bottom: 16px;">
        <label for="login-email" style="display:block; margin-bottom: 6px; font-size: 0.85rem; color: var(--text-secondary);">Email Quản Trị</label>
        <input type="email" id="login-email" required value="admin@example.com" placeholder="admin@example.com" style="width:100%; padding: 10px 12px; border:1px solid var(--border-default); border-radius:6px; background:var(--bg-input); color:var(--text-main);" />
      </div>

      <div class="form-group" style="margin-bottom: 16px;">
        <label for="login-password" style="display:block; margin-bottom: 6px; font-size: 0.85rem; color: var(--text-secondary);">Mật Khẩu</label>
        <input type="password" id="login-password" required value="admin123" placeholder="••••••••" style="width:100%; padding: 10px 12px; border:1px solid var(--border-default); border-radius:6px; background:var(--bg-input); color:var(--text-main);" />
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 0.85rem;">
        <label style="display:flex; align-items:center; gap:6px; cursor:pointer; color:var(--text-secondary);">
          <input type="checkbox" id="login-remember" checked />
          Ghi nhớ đăng nhập
        </label>
        <a href="javascript:void(0)" onclick="showMsg('Liên hệ Admin hệ thống để cấp lại mật khẩu', 'info')" style="color:var(--primary); text-decoration:none;">Quên mật khẩu?</a>
      </div>

      <button type="submit" class="primary" style="width:100%; padding: 12px; font-size: 0.95rem; font-weight:600; border-radius:6px; margin-bottom: 12px;">🔐 Đăng Nhập Hệ Thống</button>
      
      <button type="button" onclick="closeLoginModal()" style="width:100%; padding: 10px; background:transparent; border:1px solid var(--border-default); color:var(--text-secondary); border-radius:6px; cursor:pointer;">Hủy</button>
    </form>
  </div>
</div>
