<div id="tab-workflow" class="tab-content">
  <!-- Workflow Control Bar -->
  <div class="card" style="margin-bottom: 20px;">
    <div class="card-header-actions" style="margin-bottom: 12px;">
      <h3>⚡ Quy Trình Tự Động Hóa (Drawflow Visual Flow Graph)</h3>
      <div style="display: flex; gap: 8px;">
        <span id="wf-status-badge" class="badge badge-active">🟢 Drawflow Engine Ready</span>
        <span id="wf-node-count" class="badge">5 Nodes</span>
      </div>
    </div>
    
    <div style="display: flex; justify-content: space-between; align-items: center; background: var(--bg-elevated); padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border-default);">
      <div style="display: flex; gap: 10px;">
        <button type="button" class="primary" onclick="runWorkflowSimulation()" style="display: flex; align-items: center; gap: 6px;">
          ▶ Chạy Quy Trình (Run Flow Simulation)
        </button>
        <button type="button" class="upload-btn" onclick="addNewWorkflowNode()">
          ➕ Thêm Node Mới
        </button>
        <button type="button" style="padding: 8px 14px; background: transparent; border: 1px solid var(--border-default); color: var(--text-secondary); border-radius: 6px; cursor: pointer;" onclick="resetWorkflowGraph()">
          🔄 Reset Graph
        </button>
      </div>

      <div style="font-size: 0.85rem; color: var(--text-secondary);">
        Thời gian thực thi: <strong id="wf-exec-time" style="color: var(--text-main);">0.00s</strong>
      </div>
    </div>
  </div>

  <!-- Main Workflow Canvas Grid -->
  <div style="display: grid; grid-template-columns: 3fr 1fr; gap: 20px;">
    <!-- Interactive Drawflow Container -->
    <div class="card" style="position: relative; height: 480px; padding: 0; overflow: hidden; background: var(--bg-base); border: 1px solid var(--border-default);">
      <div style="position: absolute; top: 12px; left: 16px; font-size: 0.8rem; color: var(--text-muted); pointer-events: none; z-index: 10;">
        💡 Màn hình Drawflow Graph Engine (Nhấp giữ kéo thả Node, kết nối các cổng Input/Output)
      </div>

      <!-- Drawflow Container -->
      <div id="drawflow" style="width: 100%; height: 100%;"></div>
    </div>

    <!-- Right Inspector Panel -->
    <div class="card" style="background: var(--bg-surface); border: 1px solid var(--border-default);">
      <h3 style="margin-top: 0; font-size: 1rem; color: var(--text-main); border-bottom: 1px solid var(--border-default); padding-bottom: 10px;">
        🔍 Node Inspector
      </h3>
      
      <div id="wf-inspector-content">
        <div style="margin-bottom: 12px;">
          <label style="font-size: 0.75rem; color: var(--text-muted); display: block;">Tên Node</label>
          <strong id="wf-inspect-name" style="font-size: 0.95rem; color: var(--text-main);">HTTP Webhook</strong>
        </div>
        <div style="margin-bottom: 12px;">
          <label style="font-size: 0.75rem; color: var(--text-muted); display: block;">Loại Node</label>
          <span id="wf-inspect-type" class="badge">Trigger</span>
        </div>
        <div style="margin-bottom: 12px;">
          <label style="font-size: 0.75rem; color: var(--text-muted); display: block;">Trạng thái</label>
          <span id="wf-inspect-status" class="badge badge-active">Active</span>
        </div>
        <div style="margin-bottom: 16px;">
          <label style="font-size: 0.75rem; color: var(--text-muted); display: block;">Cấu hình / Parameters</label>
          <textarea id="wf-inspect-params" rows="5" readonly style="width: 100%; font-family: monospace; font-size: 0.8rem; padding: 8px; background: var(--bg-input); color: var(--text-main); border: 1px solid var(--border-default); border-radius: 6px;">{
  "method": "POST",
  "endpoint": "/api/upload",
  "auth": "BearerToken"
}</textarea>
        </div>
        <button type="button" class="primary" onclick="executeSelectedNode()" style="width: 100%; padding: 8px; font-size: 0.85rem;">⚡ Chạy Riêng Node Này</button>
      </div>
    </div>
  </div>
</div>
